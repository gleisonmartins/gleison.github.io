<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gleison.com.br</title>
<meta name="description" content="Domínio pessoal de Gleison.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap');

  :root{
    --bg: #0d1117;
    --panel: #121820;
    --panel-border: #232c37;
    --text: #dfe6ee;
    --text-dim: #7c8b9c;
    --amber: #f2a65a;
    --violet: #8b83d6;
    --green: #6fcf97;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    height:100%;
    background:
      radial-gradient(circle at 20% 0%, rgba(139,131,214,0.08), transparent 40%),
      radial-gradient(circle at 80% 100%, rgba(242,166,90,0.08), transparent 40%),
      var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }

  .terminal{
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,0.7);
    overflow: hidden;
  }

  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding: 12px 16px;
    background: #0f151c;
    border-bottom: 1px solid var(--panel-border);
  }

  .dot{ width:10px; height:10px; border-radius:50%; }
  .dot.red{ background:#e0605a; }
  .dot.yellow{ background:#e0b04f; }
  .dot.green{ background:#5fbf74; }

  .titlebar span{
    margin-left: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  .body{
    padding: 28px 24px 32px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    line-height: 1.7;
  }

  .prompt{ color: var(--green); }
  .query{ color: var(--text); }
  .cursor{
    display:inline-block;
    width: 8px;
    height: 16px;
    background: var(--amber);
    vertical-align: -3px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  #typed-line{ white-space: pre; }

  .result{
    margin-top: 22px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .result.show{ opacity:1; transform: translateY(0); }

  .card{
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 20px;
    background: #0f151c;
  }

  .name{
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 26px;
    font-weight: 500;
    color: #fff;
    margin: 0 0 4px;
  }

  .role{
    color: var(--text-dim);
    font-size: 13px;
    margin: 0 0 16px;
  }

  .tags{
    display:flex;
    gap:8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .tag{
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
  }
  .tag.amber{ color: var(--amber); border-color: rgba(242,166,90,0.35); }
  .tag.violet{ color: var(--violet); border-color: rgba(139,131,214,0.35); }

  .waveform{
    display:flex;
    align-items:flex-end;
    gap:3px;
    height: 28px;
    margin-top: 4px;
  }
  .waveform span{
    width: 3px;
    background: var(--violet);
    border-radius: 2px;
    animation: wave 1.6s ease-in-out infinite;
    opacity: 0.6;
  }
  @keyframes wave{
    0%, 100% { transform: scaleY(0.3); }
    50% { transform: scaleY(1); }
  }

  .footer-note{
    margin-top: 18px;
    font-size: 11px;
    color: var(--text-dim);
  }

  @media (prefers-reduced-motion: reduce){
    .cursor, .waveform span{ animation: none; }
  }
</style>
</head>
<body>

<div class="terminal">
  <div class="titlebar">
    <div class="dot red"></div>
    <div class="dot yellow"></div>
    <div class="dot green"></div>
    <span>contato: gleisonmartins@gmail.com</span>
  </div>
  <div class="body">
    <div>
      <span class="prompt">SQL&gt;</span>
      <span id="typed-line" class="query"></span><span class="cursor"></span>
    </div>

    <div class="result" id="result">
      <div class="card">
        <p class="name">Gleison Martins Caiero</p>
        <p class="role">Este é o meu domínio pessoal.</p>
        <div class="tags">
          <span class="tag amber">DBA Oracle</span>
          <span class="tag">Administrador de Banco de Dados</span>
          <span class="tag violet">Música &amp; Design</span>
        </div>
        <div class="waveform" aria-hidden="true">
          <span style="height:40%; animation-delay:0s"></span>
          <span style="height:70%; animation-delay:.1s"></span>
          <span style="height:100%; animation-delay:.2s"></span>
          <span style="height:55%; animation-delay:.3s"></span>
          <span style="height:85%; animation-delay:.4s"></span>
          <span style="height:35%; animation-delay:.5s"></span>
          <span style="height:65%; animation-delay:.6s"></span>
          <span style="height:90%; animation-delay:.7s"></span>
          <span style="height:45%; animation-delay:.8s"></span>
        </div>
        <p class="footer-note">1 row returned &middot; www.gleison.com.br</p>
      </div>
    </div>
  </div>
</div>

<script>
  const text = "SELECT owner FROM gleison.com.br;";
  const el = document.getElementById('typed-line');
  const result = document.getElementById('result');
  let i = 0;

  function type(){
    if(i <= text.length){
      el.textContent = text.slice(0, i);
      i++;
      setTimeout(type, 35);
    } else {
      setTimeout(() => result.classList.add('show'), 200);
    }
  }
  type();
</script>

</body>
</html>
